[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-document-intelligence"
version = "0.1.0"
description = "Document ingestion, invoice extraction, validation, and search API."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "Pillow>=13,<14",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.12,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
